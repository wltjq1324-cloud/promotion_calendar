name: SKU usage backfill (연간 출고 1회 수집)

# 2026년 SKU 주차별 출고 기초 자료용 1회 수집. 평소에는 돌지 않는다(수동 실행만).
# 다시 받아야 하면 아래 push 트리거를 되살려 작업 브랜치에 푸시한다. 스크립트는 끝난 날짜를 건너뛰고 이어받는다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sku-usage-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch out_perf_period by day
        timeout-minutes: 130
        env:
          OURBOX_API_ACCESS_KEY: ${{ secrets.OURBOX_API_ACCESS_KEY }}
          OURBOX_API_SECRET_KEY: ${{ secrets.OURBOX_API_SECRET_KEY }}
        run: node scripts/sku-usage-backfill.mjs

      - name: Commit result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sku-usage-2026.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: sku usage backfill 2026"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
