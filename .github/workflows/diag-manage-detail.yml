name: Diag manage/products detail (1회성, 값 미출력)
on:
  push:
    paths: ['.github/workflows/diag-manage-detail.yml', 'scripts/diag-manage-detail.mjs']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/diag-manage-detail.mjs
        env:
          OURBOX_API_ACCESS_KEY: ${{ secrets.OURBOX_API_ACCESS_KEY }}
          OURBOX_API_SECRET_KEY: ${{ secrets.OURBOX_API_SECRET_KEY }}
