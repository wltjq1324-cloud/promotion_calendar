name: Update OurBox inventory

on:
  workflow_dispatch:
  schedule:
    # 아침 08시 전에 반영하려고 새벽 03:15~07:15 KST(18:15~22:15 UTC)에 여러 번 시도한다.
    # GitHub 예약 실행은 이 시간대에 2~4시간씩 밀린다(2026-10-29~11-16 실측: 07:50 예약 → 10:30~13:22 반영).
    # 각 시도는 오늘 03:00 이후 스냅샷이 이미 있으면 건너뛰므로 아워박스 조회는 하루 1회 그대로다.
    - cron: '15 18 * * *'
    - cron: '15 19 * * *'
    - cron: '15 20 * * *'
    - cron: '15 21 * * *'
    - cron: '15 22 * * *'
  push:
    paths:
      - '.github/workflows/update-inventory.yml'
      - 'scripts/update-inventory.ps1'

permissions:
  contents: write

concurrency:
  group: inventory
  cancel-in-progress: false

jobs:
  update-inventory:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip if already updated today
        id: guard
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $kst = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), [System.TimeZoneInfo]::FindSystemTimeZoneById('Korea Standard Time'))
          $raw = Get-Content inventory-latest.json -Raw
          $m = [regex]::Match($raw, '"generated_at"\s*:\s*"([^"]+)"')
          if ($m.Success -and $m.Groups[1].Value -ge ($kst.ToString('yyyy-MM-dd') + ' 03:00')) {
            Write-Host "오늘 스냅샷이 이미 있음($($m.Groups[1].Value)) — 건너뜀"
            "skip=true" >> $env:GITHUB_OUTPUT
          }

      - name: Fetch latest inventory
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        env:
          OURBOX_API_ACCESS_KEY: ${{ secrets.OURBOX_API_ACCESS_KEY }}
          OURBOX_API_SECRET_KEY: ${{ secrets.OURBOX_API_SECRET_KEY }}
        run: ./scripts/update-inventory.ps1

      - name: Commit inventory snapshot
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory-latest.json
          if (git diff --cached --quiet) {
            Write-Host "No inventory changes."
          } else {
            git commit -m "chore: update inventory snapshot"
            # box-stock 워크플로도 main에 커밋하므로 밀렸으면 rebase 후 재시도
            for ($i = 1; $i -le 4; $i++) {
              git pull --rebase origin main
              git push origin HEAD:main
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds (5 * $i)
            }
          }
