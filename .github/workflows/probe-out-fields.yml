name: Probe out_perf fields (one-off)
on:
  push:
    paths:
      - '.github/workflows/probe-out-fields.yml'
      - 'scripts/probe-out-fields.mjs'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        env:
          OURBOX_API_ACCESS_KEY: ${{ secrets.OURBOX_API_ACCESS_KEY }}
          OURBOX_API_SECRET_KEY: ${{ secrets.OURBOX_API_SECRET_KEY }}
        run: node scripts/probe-out-fields.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out-fields.json
          git commit -m "chore: probe out_perf fields (one-off)"
          for i in 1 2 3 4; do git push && exit 0; git pull --rebase origin main || exit 1; done; exit 1
